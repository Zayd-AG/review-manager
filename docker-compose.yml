services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: feedbacklens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedbacklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
      POSTGRES_DB: ${POSTGRES_DB:-feedbacklens}
    ports:
      - "5432:5432"
    volumes:
      - feedbacklens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-feedbacklens}:${POSTGRES_PASSWORD:-localdevpassword}@postgres:5432/${POSTGRES_DB:-feedbacklens}
      HF_HOME: /app/.hf_cache
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    gpus: all
    volumes:
      - ./finetuning/checkpoints:/app/finetuning/checkpoints:ro
      - hf-cache:/app/.hf_cache

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  feedbacklens-pgdata:
  hf-cache:
